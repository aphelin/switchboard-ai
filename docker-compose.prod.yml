# Production: docker compose -f docker-compose.prod.yml up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - server/.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Generated images (served by the API) and the cached embedding model
      - server_storage:/app/storage
      - transformers_cache:/app/.cache

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      # Baked into the browser bundle at build time (set them in the shell or a root .env).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public API URL, e.g. https://api.example.com/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL to the public app URL}
    ports:
      - "3000:3000"
    env_file:
      - client/.env.production
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  server_storage:
  transformers_cache:
