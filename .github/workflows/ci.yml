name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  server:
    name: Server (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint -- --max-warnings=1000
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    name: Client (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  evals:
    name: RAG evals (retrieval always, generation when a key is available)
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_ai_toolkit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_ai_toolkit?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Without a real key the run stays free: retrieval metrics only (local embeddings).
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || 'ci-no-key' }}
      EVAL_SKIP_GENERATION: ${{ secrets.POLLINATIONS_API_KEY == '' && '1' || '' }}
      STORAGE_DIR: ./storage
      # Throwaway value: CI never serves real users, but the config requires a 32+ char secret.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-real-sessions
      TRANSFORMERS_CACHE_DIR: ./.cache/transformers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: server/.cache/transformers
          key: transformers-${{ runner.os }}-bge-small-en-v1.5
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run eval
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: server/evals/results/latest.json
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
