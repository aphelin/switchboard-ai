name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  server:
    name: Server (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Check mode: formatting or lint problems fail the build instead of being fixed on the runner.
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    name: Client (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  evals:
    name: RAG evals (retrieval always, generation when a key is available)
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: switchboard_ai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/switchboard_ai?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Without a real key the run stays free: retrieval metrics only (local embeddings).
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || 'ci-no-key' }}
      EVAL_SKIP_GENERATION: ${{ secrets.POLLINATIONS_API_KEY == '' && '1' || '' }}
      STORAGE_DIR: ./storage
      # Throwaway value: CI never serves real users, but the config requires a 32+ char secret.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-real-sessions
      # Throwaway AES key (32 zero bytes): CI stores no real provider keys.
      CREDENTIALS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TRANSFORMERS_CACHE_DIR: ./.cache/transformers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache the local embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/.cache/transformers
          key: transformers-${{ runner.os }}-bge-small-en-v1.5
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run eval
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report
          path: server/evals/results/latest.json
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build client image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./client
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000/api
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
