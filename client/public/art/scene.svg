<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- The ground scene of Switchboard AI: mint haze, nine light shafts from an apex above the frame, dust in the beams.
       Source for public/art/scene.webp; re-render it after editing (see docs/art-assets.md). -->
  <defs>
    <radialGradient id="ground-fade" cx="0.5" cy="0" r="0.64">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="ground-top" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <rect width="1600" height="1000" fill="url(#ground-fade)"/>
    </mask>
    <linearGradient id="ground-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafff5" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a9f3d3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#86ecbf" stop-opacity="0"/>
    </linearGradient>
    <filter id="ground-soft" filterUnits="userSpaceOnUse" x="0" y="-320" width="1600" height="1320">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="ground-haze" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0019 0.0034" numOctaves="3" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.95  0 0 0 0 0.79  0 0 0 1.9 -0.72"/>
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="ground-dust" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" filter="url(#ground-haze)" mask="url(#ground-top)"/>
  <g filter="url(#ground-soft)" mask="url(#ground-top)" fill="url(#ground-ray)">
    <polygon opacity="0.5" points="795,-300 805,-300 270,1000 190,1000"/>
    <polygon opacity="0.38" points="795,-300 805,-300 418,1000 382,1000"/>
    <polygon opacity="0.72" points="795,-300 805,-300 604,1000 476,1000"/>
    <polygon opacity="0.55" points="795,-300 805,-300 716,1000 664,1000"/>
    <polygon opacity="0.95" points="795,-300 805,-300 884,1000 716,1000"/>
    <polygon opacity="0.6" points="795,-300 805,-300 959,1000 891,1000"/>
    <polygon opacity="0.7" points="795,-300 805,-300 1116,1000 1004,1000"/>
    <polygon opacity="0.42" points="795,-300 805,-300 1242,1000 1198,1000"/>
    <polygon opacity="0.46" points="795,-300 805,-300 1426,1000 1334,1000"/>
  </g>
  <g fill="#c8ffe6">
    <circle cx="236" cy="214" r="2.4" opacity="0.3"/>
    <circle cx="412" cy="128" r="1.8" opacity="0.36"/>
    <circle cx="556" cy="318" r="6" opacity="0.1" filter="url(#ground-dust)"/>
    <circle cx="688" cy="96" r="2.2" opacity="0.4"/>
    <circle cx="764" cy="262" r="1.6" opacity="0.44"/>
    <circle cx="842" cy="388" r="3" opacity="0.18"/>
    <circle cx="936" cy="156" r="3.5" opacity="0.24"/>
    <circle cx="1064" cy="286" r="8" opacity="0.08" filter="url(#ground-dust)"/>
    <circle cx="1238" cy="118" r="2.2" opacity="0.34"/>
    <circle cx="1348" cy="344" r="5" opacity="0.12" filter="url(#ground-dust)"/>
    <circle cx="186" cy="452" r="7" opacity="0.07" filter="url(#ground-dust)"/>
    <circle cx="652" cy="486" r="9" opacity="0.06" filter="url(#ground-dust)"/>
    <circle cx="996" cy="448" r="2.4" opacity="0.18"/>
    <circle cx="1470" cy="214" r="1.8" opacity="0.28"/>
    <circle cx="1180" cy="540" r="5" opacity="0.07" filter="url(#ground-dust)"/>
    <circle cx="364" cy="560" r="4" opacity="0.08" filter="url(#ground-dust)"/>
    <circle cx="1120" cy="60" r="1.6" opacity="0.3"/>
    <circle cx="520" cy="40" r="2" opacity="0.26"/>
  </g>
</svg>
